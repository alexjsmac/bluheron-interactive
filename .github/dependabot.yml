# Dependabot is configuration, not a workflow — GitHub reads this file directly
# and opens the pull requests itself, which ci.yml then checks like any other PR.
#
# Updates are grouped because this is a small marketing site: a weekly handful of
# single-package PRs is noise nobody reads, whereas one grouped PR per area is a
# review someone will actually do.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Hold back releases younger than this. A merge auto-deploys to Pages, and
    # hijacked npm releases are usually caught and yanked within days.
    # Security updates ignore cooldown, so advisories still land immediately.
    cooldown:
      default-days: 3
      semver-major-days: 7
    # TypeScript 7 is the Go rewrite and drops the JS compiler API that
    # @astrojs/check is built on. Remove this once @astrojs/check supports 7;
    # until then every 7.x PR fails npm ci.
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      # Astro and its first-party integrations move together; splitting them
      # produces PRs that fail until their siblings land.
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      # Font packages are versioned in lockstep upstream and are content, not code.
      fontsource:
        patterns:
          - '@fontsource-variable/*'
      # Everything else: one PR for the safe bumps, majors left on their own so
      # they get read individually.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - '*'
